name: OpenCode PR Chat

on:
  issue_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      startsWith(github.event.comment.body, '/opencode')
    name: OpenCode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Get PR branch
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_BRANCH=$(gh pr view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --json headRefName -q '.headRefName')
          echo "branch=$PR_BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          sparse-checkout: .github/actions
          ref: ${{ steps.pr.outputs.branch }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Post acknowledgement
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr comment "${{ github.event.issue.number }}" \
            --body "Working on it... ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))"
